# =========================
# 🌐 HTTP → HTTPS
# =========================
server {
    listen 80;
    server_name bitsmash.ovh;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# =========================
# 🔒 HTTPS
# =========================
server {
    listen 443 ssl;
    server_name bitsmash.ovh;

    ssl_certificate /etc/letsencrypt/live/bitsmash.ovh/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bitsmash.ovh/privkey.pem;

    # =========================
    # 🏠 LANDING BITS MASH
    # =========================
    location / {
        root /usr/share/nginx/landing;
        index index.html;
    }

    # =========================
    # 🏠 LANDING ABP
    # =========================
    location = /abp {
        return 301 /abp/;
    }

    location /abp/ {
        alias /usr/share/nginx/landing_abp/;
        index index.html;
        try_files $uri $uri/ /abp/index.html;
    }

    # =========================
    # 💅 REDIRECT
    # =========================
    location = /admin/nails {
        return 301 /admin/nails/front/;
    }

    location = /admin/nails/ {
        return 301 /admin/nails/front/;
    }

    location = /nails {
        return 301 /public/nails/front/;
    }

    location = /nails/ {
        return 301 /public/nails/front/;
    }


    # =========================
    # 🧾 PHPMYADMIN
    # =========================
    location /nails/phpmyadmin/ {
        proxy_pass http://phpmyadmin:80/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Ssl on;

        proxy_redirect off;
    }

    # =========================
    # 🧠 API
    # =========================
    location /nails/api/ {
        proxy_pass http://citas_api:80/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_redirect off;
    }

    # =========================
    # 💅 ANGULAR
    # =========================
    location = /public/nails/front {
        return 301 /public/nails/front/;
    }

    location /public/nails/front/ {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /public/nails/front/index.html;
    }

    location /admin/nails/front/ {
        alias /usr/share/nginx/html/;
        index index.html;

        try_files $uri $uri/ /admin/nails/front/index.html;
    }

    # =========================
    # 🚫 OCULTAR ARCHIVOS
    # =========================
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
