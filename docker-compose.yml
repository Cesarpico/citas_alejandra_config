services:

  # =========================
  # 🧠 MARIADB
  # =========================
  mariadb:
    image: mariadb:11
    container_name: mariadb
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: qwer..1234
      MYSQL_DATABASE: manicura
      MYSQL_USER: manicura
      MYSQL_PASSWORD: alejandracgz10
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - citas_net

  # =========================
  # 🧾 PHPMYADMIN
  # =========================
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin
    restart: always
    environment:
      PMA_HOST: mariadb
      MYSQL_ROOT_PASSWORD: qwer..1234
      PMA_ABSOLUTE_URI: https://bitsmash.ovh/nails/phpmyadmin/
      PMA_COOKIE_SECURE: "true"
    depends_on:
      - mariadb
    networks:
      - citas_net

  # =========================
  # 🧠 API (Slim / PHP)
  # =========================
  api:
    build: ./backend
    container_name: citas_api
    restart: always
    volumes:
      - ./backend:/var/www/html
    depends_on:
      - mariadb
    networks:
      - citas_net
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # =========================
  # 🌐 NGINX (FRONT + PROXY)
  # =========================
  nginx:
    image: nginx:latest
    container_name: citas_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./frontend:/usr/share/nginx/html
      - ./publicNails:/usr/share/nginx/html/public/nails/front:ro
      - /opt/landing:/usr/share/nginx/landing
      - /opt/landing_abp:/usr/share/nginx/landing_abp
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - /var/www/certbot:/var/www/certbot
      - /etc/letsencrypt:/etc/letsencrypt
    depends_on:
      - api
      - phpmyadmin
    networks:
      - citas_net

  # =========================
  # 🔐 CERTBOT (utilitario)
  # =========================
  certbot:
    image: certbot/certbot
    container_name: citas_certbot
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - /var/www/certbot:/var/www/certbot

# =========================
# 📦 VOLUMES
# =========================
volumes:
  mariadb_data:

# =========================
# 🌐 NETWORK
# =========================
networks:
  citas_net:
    driver: bridge
